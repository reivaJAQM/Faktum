appId: com.faktum.sri
productName: Faktum
copyright: Copyright © 2026 SystMa
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - build/icon.png
  - build/icon.ico
  - package.json
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: Faktum-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Faktum
  uninstallDisplayName: Faktum
  runAfterFinish: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerLanguages:
    - es_ES
  language: "3082"
