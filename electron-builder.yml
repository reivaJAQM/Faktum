appId: com.faktum.sri
productName: Faktum
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - build/icon.png
  - build/icon.ico
  - package.json
mac:
  icon: build/icon.icns
  category: public.app-category.finance
  target:
    - dmg
    - zip
  artifactName: Faktum-${version}-${arch}.${ext}
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: Faktum-Setup-${version}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Faktum
  uninstallDisplayName: Faktum
portable:
  artifactName: Faktum-Portable-${version}-${arch}.${ext}
